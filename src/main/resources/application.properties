spring.application.name=pisa-test

# mysql
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# 生产环境 MySQL 与应用同机部署，走本机回环；如分离部署改为对应内网地址
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/pisa_test?serverTimezone=Asia/Shanghai
spring.datasource.username=root
# 密码不入库：通过环境变量 DB_PASSWORD 注入（服务器上由 systemd EnvironmentFile=/etc/pisa-test.env 提供）
spring.datasource.password=${DB_PASSWORD:}

# mybatis
mybatis.mapper-locations=classpath:mybatis/*.xml
mybatis.type-aliases-package=com.research.pisatest.pojo

# redis
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.database=0
# 连接超时 10s（原 1800000ms=30min，故障时会拖垮 Tomcat 线程池）
spring.data.redis.timeout=10000
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-wait=2000
spring.data.redis.lettuce.pool.max-idle=5
spring.data.redis.lettuce.pool.min-idle=0
